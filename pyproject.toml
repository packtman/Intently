[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-graph"
version = "0.1.0"
description = "Intently - Multi-dimensional product analysis bridging PRDs to code across security, privacy, compliance, engineering, and architecture"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Security Team"}
]
keywords = ["security", "privacy", "compliance", "code-analysis", "threat-modeling", "prd", "architecture", "engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "tiktoken>=0.5.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
    "chromadb>=0.4.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
# LSP integration for enhanced code analysis (TypeScript, Kotlin)
lsp = [
    "pygls>=1.3.0",  # Python LSP server library (for building/connecting)
]

[project.scripts]
context-graph = "context_graph.cli:app"

[project.urls]
Homepage = "https://github.com/packtman/Intently"
Documentation = "https://github.com/packtman/Intently#readme"
Issues = "https://github.com/packtman/Intently/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

