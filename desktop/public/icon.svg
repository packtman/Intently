<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9d4"/>
      <stop offset="100%" style="stop-color:#00afb0"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  
  <!-- Shield shape -->
  <path d="M256 80 L400 140 L400 280 C400 360 340 420 256 440 C172 420 112 360 112 280 L112 140 L256 80Z" 
        fill="url(#shieldGradient)" stroke="#00d9d4" stroke-width="4"/>
  
  <!-- Graph nodes -->
  <circle cx="256" cy="180" r="24" fill="#00d9d4"/>
  <circle cx="192" cy="280" r="20" fill="#00d9d4" opacity="0.8"/>
  <circle cx="320" cy="280" r="20" fill="#00d9d4" opacity="0.8"/>
  <circle cx="256" cy="350" r="16" fill="#00d9d4" opacity="0.6"/>
  
  <!-- Graph connections -->
  <line x1="256" y1="180" x2="192" y2="280" stroke="#00d9d4" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="180" x2="320" y2="280" stroke="#00d9d4" stroke-width="3" opacity="0.6"/>
  <line x1="192" y1="280" x2="256" y2="350" stroke="#00d9d4" stroke-width="3" opacity="0.6"/>
  <line x1="320" y1="280" x2="256" y2="350" stroke="#00d9d4" stroke-width="3" opacity="0.6"/>
</svg>

