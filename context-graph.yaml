# Context Graph Configuration
# Copy to context-graph.yaml and customize

# LLM Provider Settings
llm:
  # Enable LLM-powered analysis (requires API keys)
  enabled: true
  
  # OpenAI configuration
  openai:
    # Set via OPENAI_API_KEY environment variable
    model: gpt-5.2
    temperature: 0.1
    max_tokens: 4096
  
  # Anthropic configuration
  anthropic:
    # Set via ANTHROPIC_API_KEY environment variable
    model: claude-opus-4-5-20251101
    temperature: 0.1
    max_tokens: 4096

  # Prompt repetition: repeat the user prompt so the model gets a second
  # attention pass over the entire input, improving accuracy with negligible
  # latency overhead.  Disabled by default; also controllable per-request.
  prompt_repetition: true

# Codebase Analysis Settings
codebase:
  # Languages to analyze
  languages:
    - python
    - kotlin
    - typescript
  
  # Paths to exclude from analysis
  exclude:
    - node_modules
    - __pycache__
    - .git
    - .venv
    - venv
    - dist
    - build
    - "*.pyc"
    - "*.egg-info"
  
  # Graph-Enhanced Analysis (optional LSP feature)
  # Provides richer code understanding when LSP servers are installed
  graph_analysis:
    enabled: true  # Enable graph-based analysis
    
    # LSP Integration (OPTIONAL - works without it, enhanced with it)
    # When enabled and LSP servers are installed, provides:
    # - Cross-file reference tracking
    # - Call hierarchy analysis
    # - Type information
    # - More accurate symbol detection
    lsp:
      enabled: true  # Try to use LSP if available
      timeout_seconds: 30
      # LSP servers (auto-detected, install separately if needed):
      # - TypeScript: npm install -g typescript-language-server typescript
      # - Python: pip install pyright
      # - Kotlin: https://github.com/fwcd/kotlin-language-server
    
    # Analysis features
    include_call_hierarchy: true  # Track who calls what
    include_references: true      # Track symbol usage
    detect_unused_exports: true   # Find dead code

# Security Review Settings
security:
  # Threat modeling frameworks to apply
  frameworks:
    - stride
    - owasp_top_10
  
  # Minimum severity to report
  min_severity: low  # critical, high, medium, low, info
  
  # Minimum confidence threshold (0.0 - 1.0)
  min_confidence: 0.5

# Report Settings
reports:
  # Include recommendations in reports
  include_recommendations: true
  
  # Include mitigations in reports
  include_mitigations: true
  
  # Output formats to generate
  formats:
    - markdown
    - json
    - dashboard

# API Server Settings
server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

