name: Nightly Garbage Collection

on:
  schedule:
    # Run at 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no PR creation)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: write

env:
  REFACTOR_BRANCH: "auto/nightly-refactor"

jobs:
  analyze:
    name: Detect Refactor Candidates
    runs-on: ubuntu-latest
    outputs:
      candidates_found: ${{ steps.scan.outputs.candidates }}
      has_medium_or_high: ${{ steps.scan.outputs.has_actionable }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run refactor scanner
        id: scan
        run: |
          python scripts/nightly_refactor.py --dry-run > scan_output.json
          CANDIDATES=$(python3 -c "import json; d=json.load(open('scan_output.json')); print(d['total_candidates'])")
          HAS_ACTIONABLE=$(python3 -c "import json; d=json.load(open('scan_output.json')); print('true' if d['by_priority'].get('medium',0) + d['by_priority'].get('high',0) > 0 else 'false')")
          echo "candidates=$CANDIDATES" >> $GITHUB_OUTPUT
          echo "has_actionable=$HAS_ACTIONABLE" >> $GITHUB_OUTPUT

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: refactor-analysis
          path: |
            docs/generated/refactor_candidates.json
            docs/generated/refactor_prompt.txt

  create-cleanup-pr:
    name: Generate Cleanup PR
    needs: analyze
    if: needs.analyze.outputs.has_medium_or_high == 'true' && (github.event.inputs.dry_run != 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download analysis
        uses: actions/download-artifact@v4
        with:
          name: refactor-analysis
          path: docs/generated/

      - name: Apply automated fixes
        id: fixes
        run: |
          python3 - <<'SCRIPT'
          import json
          import re
          from pathlib import Path

          # Apply safe, mechanical fixes only (no LLM needed)
          report = json.load(open("docs/generated/refactor_candidates.json"))
          fixes_applied = 0

          for candidate in report["candidates"]:
              if candidate["category"] == "error_handling" and candidate["priority"] == "medium":
                  filepath = Path(candidate["file"])
                  if not filepath.exists():
                      continue
                  content = filepath.read_text()
                  lines = content.split("\n")
                  line_idx = candidate["line"] - 1
                  if line_idx < len(lines):
                      old_line = lines[line_idx]
                      if re.match(r"(\s*)except\s*:", old_line):
                          indent = re.match(r"(\s*)", old_line).group(1)
                          lines[line_idx] = f"{indent}except Exception:"
                          filepath.write_text("\n".join(lines))
                          fixes_applied += 1

          print(f"Applied {fixes_applied} mechanical fixes")
          Path("fix_count.txt").write_text(str(fixes_applied))
          SCRIPT

          FIX_COUNT=$(cat fix_count.txt)
          echo "fixes=$FIX_COUNT" >> $GITHUB_OUTPUT

      - name: Commit and create PR
        if: steps.fixes.outputs.fixes > 0
        run: |
          git config user.name "Intently Bot"
          git config user.email "bot@intently.dev"

          BRANCH="auto/nightly-cleanup-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: nightly cleanup — ${{ steps.fixes.outputs.fixes }} mechanical fixes

          Applied by the nightly garbage collection workflow.
          See docs/generated/refactor_candidates.json for full analysis.

          Categories fixed:
          - Bare except clauses -> except Exception
          "
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: Nightly cleanup ($(date +%Y-%m-%d))" \
            --body "## Nightly Garbage Collection

          This PR was automatically generated by the nightly refactor workflow.

          **Fixes applied:** ${{ steps.fixes.outputs.fixes }}

          ### What was fixed
          - Bare \`except:\` clauses replaced with \`except Exception:\`

          ### Analysis
          Full refactor candidate report is in \`docs/generated/refactor_candidates.json\`.

          ---
          _Auto-generated. Review before merging._" \
            --base main \
            --label "automated,tech-debt"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report:
    name: Update Generated Docs
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate report
        run: python scripts/nightly_refactor.py

      - name: Commit updated reports
        run: |
          git config user.name "Intently Bot"
          git config user.email "bot@intently.dev"
          git add docs/generated/
          git diff --cached --quiet || git commit -m "docs: update nightly refactor analysis [skip ci]"
          git push || true
