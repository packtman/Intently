name: Agent Self-Review (Intently Dogfood)

on:
  pull_request:
    branches: [main, intently_cloud_hosted]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  boundary-check:
    name: Architectural Boundary Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run boundary enforcer
        id: boundaries
        run: |
          python scripts/enforce_boundaries.py --json > boundary_report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment boundary results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('boundary_report.json', 'utf8'));
            } catch (e) {
              report = { status: 'ERROR', summary: { total_violations: 0 }, violations: [] };
            }

            const status_icon = report.status === 'PASS' ? '✅' : '❌';
            let body = `## ${status_icon} Boundary Enforcement Report\n\n`;
            body += `**Status:** ${report.status}\n`;
            body += `**Files scanned:** ${report.summary?.files_scanned || 0}\n`;
            body += `**Violations:** ${report.summary?.total_violations || 0}\n\n`;

            if (report.violations && report.violations.length > 0) {
              body += `### Violations\n\n`;
              body += `| Severity | Rule | File | Line | Fix |\n`;
              body += `|----------|------|------|------|-----|\n`;
              for (const v of report.violations.slice(0, 20)) {
                body += `| ${v.severity} | ${v.rule_id} | \`${v.file}\` | ${v.line} | ${v.fix.substring(0, 100)} |\n`;
              }
              if (report.violations.length > 20) {
                body += `\n_...and ${report.violations.length - 20} more violations._\n`;
              }
            }

            body += `\n---\n_Generated by Intently self-review. See \`scripts/enforce_boundaries.py\` for details._`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c => c.body.includes('Boundary Enforcement Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  security-review:
    name: Security Pattern Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]" --quiet

      - name: Get changed files
        id: changes
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.py' > changed_files.txt
          echo "count=$(wc -l < changed_files.txt | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Run security analysis on diff
        if: steps.changes.outputs.count != '0'
        id: security
        run: |
          python3 - <<'SCRIPT'
          import json
          import re
          import sys
          from pathlib import Path

          SECURITY_RULES = [
              {
                  "id": "SEC001_HARDCODED_SECRET",
                  "pattern": r'(?:api_key|secret|token|password)\s*=\s*["\'][^"\']{8,}["\']',
                  "severity": "critical",
                  "message": "Hardcoded secret detected",
                  "remediation": "Use os.environ.get() or a secrets manager"
              },
              {
                  "id": "SEC002_XSS_RISK",
                  "pattern": r'f["\'].*<(?:script|iframe|object|embed).*["\']',
                  "severity": "critical",
                  "message": "Potential XSS: raw HTML in f-string",
                  "remediation": "Use html.escape() or a template engine with auto-escaping"
              },
              {
                  "id": "SEC003_SQL_INJECTION",
                  "pattern": r'f["\'].*\b(?:SELECT|INSERT|UPDATE|DELETE|DROP)\b.*{.*}.*["\']',
                  "severity": "critical",
                  "message": "Potential SQL injection: f-string in SQL query",
                  "remediation": "Use parameterized queries with ? placeholders"
              },
              {
                  "id": "SEC004_UNSAFE_DESERIALIZATION",
                  "pattern": r'pickle\.loads?\(|yaml\.load\([^)]*\)(?!.*Loader)',
                  "severity": "high",
                  "message": "Unsafe deserialization detected",
                  "remediation": "Use yaml.safe_load() or avoid pickle for untrusted data"
              },
              {
                  "id": "SEC005_PATH_TRAVERSAL",
                  "pattern": r'open\(.*\+.*\)|os\.path\.join\(.*request',
                  "severity": "high",
                  "message": "Potential path traversal vulnerability",
                  "remediation": "Validate and sanitize file paths; use Path.resolve() and check prefix"
              },
          ]

          findings = []
          changed_files = Path("changed_files.txt").read_text().strip().split("\n")

          for filepath in changed_files:
              if not filepath or not Path(filepath).exists():
                  continue
              try:
                  lines = Path(filepath).read_text().splitlines()
              except Exception:
                  continue

              for rule in SECURITY_RULES:
                  regex = re.compile(rule["pattern"], re.IGNORECASE)
                  for i, line in enumerate(lines, 1):
                      if line.strip().startswith("#"):
                          continue
                      if regex.search(line):
                          findings.append({
                              "rule_id": rule["id"],
                              "severity": rule["severity"],
                              "file": filepath,
                              "line": i,
                              "message": rule["message"],
                              "remediation": rule["remediation"],
                              "code_snippet": line.strip()[:120]
                          })

          report = {
              "status": "FAIL" if any(f["severity"] == "critical" for f in findings) else "PASS",
              "files_analyzed": len(changed_files),
              "findings_count": len(findings),
              "findings": findings
          }

          Path("security_report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          SCRIPT

      - name: Comment security findings on PR
        if: always() && steps.changes.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('security_report.json', 'utf8'));
            } catch (e) {
              return;
            }

            if (report.findings_count === 0) return;

            const status_icon = report.status === 'PASS' ? '⚠️' : '🚨';
            let body = `## ${status_icon} Security Analysis Report\n\n`;
            body += `**Status:** ${report.status}\n`;
            body += `**Files analyzed:** ${report.files_analyzed}\n`;
            body += `**Findings:** ${report.findings_count}\n\n`;

            if (report.findings.length > 0) {
              body += `### Findings\n\n`;
              for (const f of report.findings.slice(0, 15)) {
                body += `#### ${f.severity.toUpperCase()}: ${f.rule_id}\n`;
                body += `- **File:** \`${f.file}:${f.line}\`\n`;
                body += `- **Issue:** ${f.message}\n`;
                body += `- **Code:** \`${f.code_snippet}\`\n`;
                body += `- **Fix:** ${f.remediation}\n\n`;
              }
            }

            body += `\n---\n_Generated by Intently security analyzer. Agents: fix these before requesting human review._`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c => c.body.includes('Security Analysis Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  golden-principles:
    name: Golden Principles Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check documentation requirement
        run: |
          python3 - <<'SCRIPT'
          import json
          import subprocess
          from pathlib import Path

          result = subprocess.run(
              ["git", "diff", "--name-only", "origin/${{ github.base_ref }}...HEAD"],
              capture_output=True, text=True
          )
          changed = result.stdout.strip().split("\n")

          src_changes = [f for f in changed if f.startswith("src/")]
          doc_changes = [f for f in changed if f.startswith("docs/")]

          structural_changes = any(
              "__init__.py" in f or "main.py" in f or "routes" in f
              for f in src_changes
          )

          report = {
              "src_files_changed": len(src_changes),
              "docs_files_changed": len(doc_changes),
              "structural_change_detected": structural_changes,
              "documentation_present": len(doc_changes) > 0,
              "compliant": not structural_changes or len(doc_changes) > 0,
          }

          if not report["compliant"]:
              report["message"] = (
                  "Structural changes detected without accompanying documentation. "
                  "Per golden_principles.md, architectural changes must have a "
                  "corresponding document in docs/design-docs/."
              )

          print(json.dumps(report, indent=2))
          Path("principles_report.json").write_text(json.dumps(report, indent=2))
          SCRIPT
